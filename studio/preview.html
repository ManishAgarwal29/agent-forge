<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; }
    #preview-status { margin: 0; padding: 8px 12px; font-size: 0.85rem; color: #52483f; border-bottom: 1px solid #e0d6ca; }
    #agent-app {
      --ns-font: system-ui, sans-serif; --ns-bg: #ffffff; --ns-fg: #17120d; --ns-primary: #b4410a;
      --ns-accent: #b4410a; --ns-border: #e0d6ca; --ns-panelbg: #ffffff; --ns-msgbg: #f5efe8; --ns-muted: #52483f;
    }
    #agent-app.ns-composed-app [data-ns-slot="chat"] { height: 520px; }
    #agent-app .ns-chat { background: var(--ns-bg); }
    #agent-app button { margin: 0; }
    #agent-app .ns-consent-actions { flex-wrap: wrap; }
    .assistant-panels { display: block; }
    [data-ns-slot="agents"] { display: none; }
  </style>
</head>
<body>
  <p id="preview-status" role="status">Starting the preview…</p>
  <div id="agent-app">
    <div data-ns-slot="header"></div>
    <div class="assistant-panels">
      <div data-ns-slot="chat"></div>
      <div data-ns-slot="agents"></div>
    </div>
    <div data-ns-slot="settings"></div>
  </div>
  <script type="module" src="preview.js"></script>
</body>
</html>
